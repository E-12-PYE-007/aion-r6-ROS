<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Weed Map</title>
<style>
  @font-face { font-family: 'Schibsted Grotesk'; font-weight: 400; src: url('/fonts/SchibstedGrotesk-400.ttf') format('truetype'); }
  @font-face { font-family: 'Schibsted Grotesk'; font-weight: 500; src: url('/fonts/SchibstedGrotesk-500.ttf') format('truetype'); }
  @font-face { font-family: 'Schibsted Grotesk'; font-weight: 600; src: url('/fonts/SchibstedGrotesk-600.ttf') format('truetype'); }
  @font-face { font-family: 'Schibsted Grotesk'; font-weight: 700; src: url('/fonts/SchibstedGrotesk-700.ttf') format('truetype'); }

  /* A fixed 1920x1080 stage scaled to the window. Left: the path plot. Top right: the camera.
     Bottom right: plant selection, weed count, start and stop. */
  :root {
    --paper: #f6f9fc; --ink: #12436a; --ink2: #3a6586; --mute: #64849e; --faint: #abbcca;
    --coral: #ff8a6e; --coral-ink: #e8664a; --fill: #dcebf8; --fill2: #cfe3f1;
    --good: #3f9f78; --warn: #f2a03d; --bad: #d6453d;
    --font: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  body { color: var(--ink); font-family: var(--font); }
  #wrap { position: absolute; left: 50%; top: 50%; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--paper); }
  #stage * { box-sizing: border-box; }
  .abs { position: absolute; margin: 0; }
  h1 { left: 96px; top: 62px; font-weight: 700; font-size: 60px; line-height: 1.1; }
  .cap { font-weight: 500; font-size: 26px; color: var(--mute); }
  .label { font-weight: 600; font-size: 36px; }
  svg text { font-family: var(--font); }
  #plot { left: 0; top: 0; width: 960px; height: 1080px; }
  .legend { left: 96px; top: 150px; display: flex; gap: 36px; align-items: center; font-size: 26px; font-weight: 500; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 12px; }
  .footer { left: 96px; top: 1004px; font-size: 32px; color: var(--mute); }
  .footer b { font-weight: 700; color: var(--ink); margin-right: 12px; }

  #conn { right: 96px; top: 74px; display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 600; }
  .light { width: 28px; height: 28px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 0 7px var(--halo);
           transition: background .4s cubic-bezier(.33,1,.68,1), box-shadow .4s cubic-bezier(.33,1,.68,1); }
  .light.g { --c: var(--good); --halo: rgba(63,159,120,.2); }
  .light.o { --c: var(--warn); --halo: rgba(242,160,61,.22); }
  .light.r { --c: var(--bad); --halo: rgba(214,69,61,.2); }
  .light.n { --c: var(--faint); --halo: rgba(171,188,202,.25); }

  #camwrap { left: 1000px; top: 230px; width: 824px; height: 463px; border-radius: 10px; background: var(--fill); overflow: hidden; }
  #camimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s cubic-bezier(.33,1,.68,1); }
  #camwrap.live #camimg { opacity: 1; }
  #camoff { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 500; color: var(--mute); transition: opacity .5s cubic-bezier(.33,1,.68,1); }
  #camwrap.live #camoff { opacity: 0; }

  .tick { display: flex; align-items: center; gap: 22px; height: 56px; cursor: pointer; font-size: 32px; font-weight: 500; user-select: none; }
  .tick.locked { cursor: default; opacity: .55; }
  .tick input { appearance: none; -webkit-appearance: none; width: 38px; height: 38px; margin: 0; border: 2px solid var(--ink); border-radius: 9px; background: transparent; position: relative; cursor: inherit; flex: none; transition: background .25s cubic-bezier(.33,1,.68,1); }
  .tick input:checked { background: var(--ink); }
  .tick input:checked::after { content: ''; position: absolute; left: 11px; top: 4px; width: 10px; height: 20px; border: solid var(--paper); border-width: 0 4px 4px 0; transform: rotate(45deg); border-radius: 1px; }
  .tick input:focus-visible, #go:focus-visible { outline: 3px solid var(--ink2); outline-offset: 4px; }
  #ticks { left: 1000px; top: 790px; width: 400px; }
  #status { left: 1480px; top: 724px; width: 344px; font-size: 24px; font-weight: 500; color: var(--mute); }
  #status.error { color: var(--bad); }
  #big { left: 1480px; top: 758px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #big b { font-size: 112px; font-weight: 700; color: var(--coral-ink); line-height: 1; margin-right: 14px; }
  #big span { font-size: 40px; font-weight: 600; }
  #go { left: 1480px; top: 884px; width: 344px; height: 88px; border-radius: 44px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); font-family: var(--font); font-weight: 600; font-size: 34px; cursor: pointer; transition: background .3s cubic-bezier(.33,1,.68,1), color .3s cubic-bezier(.33,1,.68,1); }
  #go.stop { background: transparent; color: var(--ink); }
  #go.start { background: linear-gradient(to right, var(--fill2) var(--p, 0%), transparent var(--p, 0%)); color: var(--ink); touch-action: none; }
  #go:disabled { opacity: .55; cursor: default; }
  #ind { left: 1480px; top: 1000px; display: flex; align-items: center; gap: 20px; font-size: 32px; font-weight: 600; height: 44px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <h1 class="abs">Live Weed Map</h1>
    <div id="conn" class="abs"><i id="connlight" class="light n"></i><span id="conntext">Connecting</span></div>

    <div class="abs legend" aria-hidden="true">
      <span><svg width="46" height="12"><line x1="3" y1="6" x2="43" y2="6" stroke="#12436a" stroke-width="3" stroke-linecap="round"/></svg>Rover path</span>
      <span><svg width="22" height="30" viewBox="-14 -34 28 40"><use href="#pin"/></svg>Weed</span>
    </div>

    <svg id="plot" class="abs" viewBox="0 0 960 1080" aria-label="Rover path and weed locations">
      <defs>
        <g id="pin">
          <path d="M0 0 C-5 -9 -14 -17 -14 -26 A14 14 0 1 1 14 -26 C14 -17 5 -9 0 0 Z" fill="#ff8a6e"/>
          <rect x="-2" y="-36" width="4" height="13" rx="2" fill="#f6f9fc"/>
          <circle cx="0" cy="-17" r="2.4" fill="#f6f9fc"/>
        </g>
        <g id="sprig" stroke="#7f9f86" stroke-width="2" stroke-linecap="round" fill="none"><path d="M-6 3 L6 -3 M-6 -3 L6 3 M0 -5 L0 5"/></g>
        <linearGradient id="fadeX" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".14" stop-color="#fff"/><stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
        <linearGradient id="fadeY" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset=".14" stop-color="#fff"/><stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
        <mask id="maskX" maskUnits="userSpaceOnUse" x="190" y="200" width="700" height="700"><rect x="190" y="200" width="700" height="700" fill="url(#fadeX)"/></mask>
        <mask id="maskY" maskUnits="userSpaceOnUse" x="190" y="200" width="700" height="700"><rect x="190" y="200" width="700" height="700" fill="url(#fadeY)"/></mask>
      </defs>
      <g mask="url(#maskY)"><g mask="url(#maskX)"><g id="trail"></g><g id="pins"></g><g id="robot"></g></g></g>
    </svg>

    <div class="abs cap" style="left:1000px; top:190px;">Live Camera With Detections</div>
    <div id="camwrap" class="abs"><img id="camimg" alt="Camera view with YOLO detections"><div id="camoff">Camera Stream Off</div></div>

    <div class="abs label" style="left:1000px; top:728px;">Which Plants Are Weeds</div>
    <div id="ticks" class="abs"></div>

    <div id="status" class="abs">Connecting</div>
    <div id="big" class="abs"><b id="nweeds">0</b><span>weeds logged</span></div>
    <button id="go" class="abs" type="button" disabled>Start</button>
    <div id="ind" class="abs"><i id="light" class="light n"></i><span id="indtext">Stack Off</span></div>

    <div class="abs footer"><b>AG-VLA</b>E-12-PYE-007</div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  function mk(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function $(id) { return document.getElementById(id); }
  var INK = '#12436a';

  /* ---- fit the stage to the window ---- */
  var wrap = $('wrap'), stage = $('stage');
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + s + ')';
    wrap.style.width = (1920 * s) + 'px'; wrap.style.height = (1080 * s) + 'px';
    wrap.style.marginLeft = (-960 * s) + 'px'; wrap.style.marginTop = (-540 * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  /* ---- the 1.5 m square window, centred on the robot ---- */
  var PL = 190, PR = 890, PT = 200, PB = 900, CX = (PL + PR) / 2, CY = (PT + PB) / 2, SC = (PR - PL) / 1.5;
  var FADE = 30;
  var view = { x: 0, y: 0 }, shown = { x: 0, y: 0, yaw: 0, have: false };
  function sx(x) { return CX + (x - view.x) * SC; }
  function sy(y) { return CY - (y - view.y) * SC; }
  function ease3(t) { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); }
  function fadeAlpha(age) { var t = age / FADE; if (t <= 0) return 1; if (t >= 1) return 0; return 1 - t * t * (3 - 2 * t); }

  var trailG = $('trail'), pinsG = $('pins'), robotG = $('robot');
  var robotNode = mk('g', {}, robotG);
  mk('rect', { x: -9, y: -7, width: 18, height: 14, rx: 3.5, fill: '#f6f9fc', stroke: INK, 'stroke-width': 2.5 }, robotNode);
  mk('rect', { x: 3.5, y: -3, width: 3.5, height: 6, rx: 1.5, fill: INK }, robotNode);
  robotNode.setAttribute('opacity', 0);

  var trail = [], segPool = [], pins = {};   // pins: id -> { node, ageAtMsg, msgTime, popAt }

  /* ---- the latest state from the bridge ---- */
  var snap = null, lastEvent = 0, lastSampleT = 0, runningSince = null, prevStack = null;
  var source = new EventSource('/events');
  source.onmessage = function (e) {
    snap = JSON.parse(e.data); lastEvent = performance.now();
    onSnapshot(snap);
  };

  function onSnapshot(s) {
    var now = performance.now();
    if (s.pose) {
      shown.target = s.pose;
      if (!shown.have) { shown.x = s.pose.x; shown.y = s.pose.y; shown.yaw = s.pose.yaw; shown.have = true; view.x = s.pose.x; view.y = s.pose.y; }
      var last = trail[trail.length - 1];
      if (!last || Math.hypot(last.x - s.pose.x, last.y - s.pose.y) > 0.01 || now - lastSampleT > 500) {
        trail.push({ x: s.pose.x, y: s.pose.y, t: now }); lastSampleT = now;
      }
    }
    var seen = {};
    s.weeds.forEach(function (w) {
      seen[w.id] = true;
      var p = pins[w.id];
      if (!p) {
        p = pins[w.id] = { node: mk('g', {}, pinsG), popAt: now };
        mk('use', { href: '#sprig' }, p.node); mk('use', { href: '#pin' }, p.node);
      } else if (w.age < p.ageAtMsg - 0.5) p.popAt = now;      // seen again after fading
      p.ageAtMsg = w.age; p.msgTime = now; p.x = w.x; p.y = w.y;
    });
    Object.keys(pins).forEach(function (id) { if (!seen[id]) { pinsG.removeChild(pins[id].node); delete pins[id]; } });
    if (s.stack !== prevStack) { runningSince = s.stack === 'running' ? now : null; prevStack = s.stack; }
    updateControls(s);
  }

  /* ---- controls ---- */
  var go = $('go'), statusEl = $('status'), ticks = $('ticks'), tickBuilt = null;
  var HOLD_MS = 1500, holdStart = null;

  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, message: 'bad reply' }; }); })
      .catch(function () { return { ok: false, message: "can't reach the display bridge" }; });
  }
  var localError = null, localErrorAt = 0;
  // The plant selection the user just made, held until the bridge's state catches up so a refresh cannot undo a click.
  var pendingSel = null, pendingAt = 0;
  function sameSet(a, b) { return a.length === b.length && a.every(function (x) { return b.indexOf(x) >= 0; }); }
  // Selection updates go out one at a time, latest last, so they cannot arrive out of order.
  var selInFlight = false, selQueued = null;
  function sendSelection(chosen) {
    if (selInFlight) { selQueued = chosen; return; }
    selInFlight = true;
    post('/api/select', { classes: chosen }).then(function (r) {
      selInFlight = false;
      if (!r.ok) { showError(r.message); pendingSel = null; selQueued = null; }
      if (selQueued) { var next = selQueued; selQueued = null; sendSelection(next); }
    });
  }
  function currentSelection(s) { return pendingSel && performance.now() - pendingAt < 1500 ? pendingSel : s.selected; }
  function showError(message) { localError = message; localErrorAt = performance.now(); }

  function buildTicks(s) {
    var key = JSON.stringify(s.plants);
    if (key === tickBuilt) return;
    tickBuilt = key; ticks.textContent = '';
    s.plants.forEach(function (p) {
      var lab = document.createElement('label'); lab.className = 'tick';
      var inp = document.createElement('input'); inp.type = 'checkbox'; inp.id = 'plant-' + p.label; inp.dataset.label = p.label;
      inp.addEventListener('change', function () {
        var chosen = currentSelection(snap).slice(), at = chosen.indexOf(p.label);
        if (inp.checked && at < 0) chosen.push(p.label);
        if (!inp.checked && at >= 0) chosen.splice(at, 1);
        pendingSel = chosen; pendingAt = performance.now();
        sendSelection(chosen);
      });
      var txt = document.createElement('span'); txt.textContent = p.name;
      lab.appendChild(inp); lab.appendChild(txt); ticks.appendChild(lab);
    });
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function updateControls(s) {
    buildTicks(s);
    if (pendingSel && sameSet(pendingSel, s.selected)) pendingSel = null;
    var shownSel = currentSelection(s);
    [].forEach.call(ticks.querySelectorAll('input'), function (inp) {
      inp.checked = shownSel.indexOf(inp.dataset.label) >= 0;
      inp.disabled = !s.can_edit_selection;
      inp.parentNode.classList.toggle('locked', !s.can_edit_selection);
    });
    $('nweeds').textContent = s.weeds.length;

    var busy = s.stack === 'starting' || s.stack === 'stopping';
    go.disabled = busy;
    go.classList.toggle('start', s.stack === 'stopped');
    go.classList.toggle('stop', s.stack === 'running' || s.stack === 'unknown');
    go.textContent = s.stack === 'stopped' ? 'Start' : s.stack === 'starting' ? 'Starting' : s.stack === 'stopping' ? 'Stopping' : 'Stop';

    var text;
    if (s.stack === 'running') text = 'Running ' + pad(Math.floor((performance.now() - runningSince) / 60000)) + ':' + pad(Math.floor(((performance.now() - runningSince) / 1000) % 60));
    else if (s.stack === 'stopped') text = 'Hold Start to launch';
    else if (s.stack === 'starting') text = 'Starting the stack';
    else if (s.stack === 'stopping') text = 'Stopping the stack';
    else text = 'Connection lost';
    var message = s.message || (localError && performance.now() - localErrorAt < 8000 ? localError : null);
    statusEl.textContent = message || text;
    statusEl.classList.toggle('error', !!message);

    var modes = { vla: ['g', 'VLA Active'], cbf: ['o', 'CBF Active'], recovery: ['r', 'Recovery Mode'], off: ['n', 'Stack Off'] };
    var m = modes[s.mode] || modes.off;
    $('light').className = 'light ' + m[0]; $('indtext').textContent = m[1];

    var alive = s.camera_alive;
    $('camwrap').classList.toggle('live', alive);
    var img = $('camimg');
    if (alive && !img.getAttribute('src')) img.src = '/camera.mjpg?' + Date.now();
    if (!alive && img.getAttribute('src')) img.removeAttribute('src');
  }

  /* start: press and hold; stop: one click */
  function holdTick(now) {
    if (holdStart === null) return;
    var p = Math.min(1, (now - holdStart) / HOLD_MS);
    go.style.setProperty('--p', (p * 100).toFixed(1) + '%');
    if (p >= 1) { holdEnd(); post('/api/start').then(function (r) { if (!r.ok) showError(r.message); }); return; }
    requestAnimationFrame(holdTick);
  }
  function holdBegin() { if (snap && snap.stack === 'stopped' && holdStart === null) { holdStart = performance.now(); requestAnimationFrame(holdTick); } }
  function holdEnd() { holdStart = null; go.style.setProperty('--p', '0%'); }
  go.addEventListener('pointerdown', function (e) { if (snap && snap.stack === 'stopped') { e.preventDefault(); holdBegin(); } });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (t) { go.addEventListener(t, holdEnd); });
  go.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); holdBegin(); } });
  go.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') holdEnd(); });
  go.addEventListener('click', function () {
    if (snap && (snap.stack === 'running' || snap.stack === 'unknown')) post('/api/stop').then(function (r) { if (!r.ok) showError(r.message); });
  });

  /* ---- drawing, every frame ---- */
  var lastFrame = performance.now();
  function frame(now) {
    var dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
    var bridgeUp = snap && now - lastEvent < 2000;

    // The robot eases toward the latest pose, and the view eases toward the robot.
    if (shown.have && shown.target) {
      var k = 1 - Math.exp(-dt * 12);
      shown.x += (shown.target.x - shown.x) * k; shown.y += (shown.target.y - shown.y) * k;
      var dyaw = Math.atan2(Math.sin(shown.target.yaw - shown.yaw), Math.cos(shown.target.yaw - shown.yaw));
      shown.yaw += dyaw * k;
      var kv = 1 - Math.exp(-dt * 4);
      view.x += (shown.x - view.x) * kv; view.y += (shown.y - view.y) * kv;
      robotNode.setAttribute('transform', 'translate(' + sx(shown.x) + ' ' + sy(shown.y) + ') rotate(' + (-shown.yaw * 180 / Math.PI).toFixed(2) + ')');
      robotNode.setAttribute('opacity', snap && snap.stack === 'running' ? 1 : 0.45);
    }

    while (trail.length && now - trail[0].t > FADE * 1000) trail.shift();
    var n = trail.length - 1;
    while (segPool.length < Math.max(0, n)) segPool.push(mk('line', { stroke: INK, 'stroke-width': 3, 'stroke-linecap': 'round' }, trailG));
    for (var i = 0; i < segPool.length; i++) {
      var seg = segPool[i];
      if (i < n) {
        var a = trail[i], b = trail[i + 1], al = fadeAlpha((now - b.t) / 1000);
        seg.setAttribute('x1', sx(a.x)); seg.setAttribute('y1', sy(a.y)); seg.setAttribute('x2', sx(b.x)); seg.setAttribute('y2', sy(b.y));
        seg.setAttribute('stroke-opacity', al.toFixed(3)); seg.style.display = al > 0.01 ? '' : 'none';
      } else seg.style.display = 'none';
    }

    Object.keys(pins).forEach(function (id) {
      var p = pins[id], age = p.ageAtMsg + (now - p.msgTime) / 1000, al = fadeAlpha(age);
      if (al <= 0.01) { p.node.style.display = 'none'; return; }
      p.node.style.display = '';
      p.node.setAttribute('transform', 'translate(' + sx(p.x) + ' ' + sy(p.y) + ')');
      p.node.setAttribute('opacity', al.toFixed(3));
      p.node.children[1].setAttribute('transform', 'scale(' + (0.5 + 0.5 * ease3((now - p.popAt) / 700)).toFixed(3) + ')');
    });

    // The light at the top: the robot link as the bridge sees it, and the bridge itself.
    var connected = bridgeUp && snap.connected;
    $('connlight').className = 'light ' + (snap ? (connected ? 'g' : 'r') : 'n');
    $('conntext').textContent = !snap ? 'Connecting' : connected ? 'Connected' : 'Connection Lost';
    if (snap && !bridgeUp) { statusEl.textContent = "Can't reach the display bridge"; statusEl.classList.add('error'); go.disabled = true; }
    else if (snap && snap.stack === 'running' && runningSince !== null) {
      var el = (now - runningSince) / 1000;
      if (!statusEl.classList.contains('error')) statusEl.textContent = 'Running ' + pad(Math.floor(el / 60)) + ':' + pad(Math.floor(el % 60));
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

navsat_transform_node:
  ros__parameters:
    frequency: 30.0
    delay: 1.0

    # magnetic_declination_radians: 0.37821285
    magnetic_declination_radians: 0.0 # the PX4 already applies declination
    yaw_offset: -0.872664626 # -50 degrees

    use_odometry_yaw: false

    zero_altitude: true
    publish_filtered_gps: true

    broadcast_utm_transform: false
    wait_for_datum: false
